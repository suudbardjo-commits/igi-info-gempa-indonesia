x-app: &app
    build:
        context: './vendor/laravel/sail/runtimes/8.5'
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.5/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: 1
        # Server bawaan PHP (artisan serve) satu proses saja; beberapa worker mencegah permintaan saling antre.
        PHP_CLI_SERVER_WORKERS: '${PHP_CLI_SERVER_WORKERS:-4}'
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
        # Membaca ribuan file vendor lewat bind mount Windows sangat lambat (php artisan ~8 detik);
        # di volume Docker hanya ~0,3 detik. Isi volume dibuat dengan `composer install` / `npm install` di kontainer.
        - 'sail-vendor:/var/www/html/vendor'
        - 'sail-node-modules:/var/www/html/node_modules'
    networks:
        - sail
    depends_on:
        pgsql:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    laravel.test:
        <<: *app
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'

    reverb:
        <<: *app
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - '${REVERB_SERVER_PORT:-8080}:8080'
        restart: unless-stopped

    horizon:
        <<: *app
        command: php artisan horizon
        restart: unless-stopped

    scheduler:
        <<: *app
        command: php artisan schedule:work
        restart: unless-stopped

    pgsql:
        image: 'postgis/postgis:16-3.4'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/init-postgis.sql:/docker-entrypoint-initdb.d/10-init-postgis.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            interval: 5s
            retries: 5
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 5s
            retries: 5
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-vendor:
        driver: local
    sail-node-modules:
        driver: local
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
